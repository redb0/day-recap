[project]
name = "day-recap"
version = "0.2.1"
description = "Local daily work log: git, Cursor, OpenCode, and Telegram into one confirmed block in an Obsidian daily note. The agent skill drafts that block and waits for a yes before writing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["obsidian", "daily-notes", "telegram", "cursor", "opencode", "agent-skill"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
authors = [{ name = "Vladimir Voronov", email = "vvoronov@mwnts.ru" }]
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qrcode>=8.2",
    "telethon>=1.45.0",
]

[project.urls]
Homepage = "https://github.com/redb0/day-recap"
Repository = "https://github.com/redb0/day-recap"
Issues = "https://github.com/redb0/day-recap/issues"
Changelog = "https://github.com/redb0/day-recap/releases"

[project.scripts]
day-recap = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

# Пакет лежит в корне, а не в src/ — как в рабочих проектах.
[tool.uv.build-backend]
module-name = "app"
module-root = ""

# PEP 735, а не [project.optional-dependencies]: группа зависимостей — понятие
# времени разработки, которое бэкенд сборки не пишет в метаданные колеса, так что
# pytest не дотянется до того, кто установит пакет. Extra — дотянулся бы.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.0.0",
    "mypy>=1.15",
    "ruff>=0.15",
    "commitizen>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

# https://docs.astral.sh/ruff/rules/
lint.select = ["ALL"]
lint.ignore = [
    "COM812",  # конфликтует с ruff format
    "CPY001",  # требует копирайт-заголовок в каждом файле: личный проект
    "D104",    # docstring в __init__.py пакета
    "D107",    # docstring в __init__
    "RUF001",  # неоднозначные символы: текст и docstring на русском
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert — это и есть тест
    "D103",  # имя теста и есть его описание
    "PLR2004",  # ожидаемое значение — литерал из спеки, не константа рядом с тестом
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
# Версия живёт только в pyproject.toml, а код читает её через
# importlib.metadata. Дублировать её в app/__init__.py нечего: второе место
# неизбежно разойдётся с первым.
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
